name: Build Video Photo Extractor APK

on:
  push:
    branches: [ "build/video-photo-extractor-20261026" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Java sources
        working-directory: video-photo-extractor
        run: |
          base64 -d java-src.tgz.b64 > java-src.tgz
          tar -xzf java-src.tgz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: video-photo-extractor
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp video-photo-extractor/app/build/outputs/apk/debug/app-debug.apk VideoPhotoExtractor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoPhotoExtractor-apk
          path: VideoPhotoExtractor.apk
          if-no-files-found: error
