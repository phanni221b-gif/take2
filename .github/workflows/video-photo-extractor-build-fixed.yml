name: Build Video Photo Extractor Release Inputs

on:
  push:
    branches: [ "build/video-photo-extractor-20261026" ]
    paths-ignore:
      - 'video-photo-extractor/dist/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Java sources
        working-directory: video-photo-extractor
        run: |
          cat java-src.fixed00 java-src.fixed01 java-src.fixed02 java-src.fixed03 java-src.fixed04 > java-src.tgz.b64
          base64 -d java-src.tgz.b64 > java-src.tgz
          echo "3f5274932359d38ba45dcc3d3d67323b3ce40c9e2d9b6e752fa5a45d4dcac470  java-src.tgz" | sha256sum -c -
          tar -xzf java-src.tgz

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: video-photo-extractor
        run: gradle --no-daemon :app:assembleRelease

      - name: Stage release inputs
        run: |
          mkdir -p release-inputs/sign-tools/lib
          cp video-photo-extractor/app/build/outputs/apk/release/app-release-unsigned.apk release-inputs/VideoPhotoExtractor-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" release-inputs/sign-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-inputs/sign-tools/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-inputs/sign-tools/lib/apksigner.jar
          chmod +x release-inputs/sign-tools/apksigner release-inputs/sign-tools/zipalign

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: VideoPhotoExtractor-release-inputs
          path: release-inputs
          if-no-files-found: error
